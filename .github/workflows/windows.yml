name: Windows x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and verify Alfa Miner CPU
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Checkout pinned build dependencies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: xmrig/xmrig-deps
          ref: ddfb65ec8bf4803a6c1c2037969546d018c76b54
          path: .deps
          persist-credentials: false
      - name: Install CMake
        run: |
          python -m pip install --disable-pip-version-check cmake==3.31.10
          if ($LASTEXITCODE -ne 0) { throw 'CMake installation failed.' }
      - name: Build, verify metadata and package
        run: |
          $cmakeDirectory = python -c "import cmake; print(cmake.CMAKE_BIN_DIR)"
          if ($LASTEXITCODE -ne 0) { throw 'CMake location failed.' }
          ./ci/build-windows.ps1 -CMake (Join-Path $cmakeDirectory 'cmake.exe')
      - name: Upload binary, source and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alfa-miner-cpu-zero-fee-windows-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
